server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ficheiros com hash no nome podem ficar em cache muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: rotas do React Router (ex.: /ementa) devolvem index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
