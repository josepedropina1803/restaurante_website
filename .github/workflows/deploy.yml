name: Deploy

# Publica o site no GitHub Pages sempre que um pull request de develop
# é merged para main. Também pode ser corrido manualmente (Actions → Deploy → Run workflow).
# Dispara no push para main (o ambiente github-pages só aceita deploys de main)
# e o job "check" confirma que o commit veio de um PR develop → main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Confirmar merge de develop
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pr.outputs.deploy }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""')
          echo "PR head: ${head:-nenhum}"
          if [ "$head" = "develop" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Push para main que não veio de um PR de develop; deploy ignorado."
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # O GitHub Pages não conhece as rotas do React Router; o 404.html
      # devolve a app para qualquer caminho (ex.: /ementa).
      - name: Fallback SPA
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy para GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
